name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check (strict on core modules)
        run: uv run mypy
      - name: Tests (mock LLM, no API key needed)
        run: uv run pytest --cov=pcbassist --cov-report=term-missing --cov-fail-under=80
      - name: Library integrity
        run: uv run pcbassist library validate
