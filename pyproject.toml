[project]
name = "pcbassist"
version = "0.1.0"
description = "Prompt-driven PCB design assistant: natural-language requirements -> reviewable design plan -> KiCad files"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "anthropic>=0.40",
]

[project.scripts]
pcbassist = "pcbassist.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcbassist"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]  # typer uses call defaults

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["pcbassist"]
warn_unused_configs = true
ignore_missing_imports = false

# Strict on core modules.
[[tool.mypy.overrides]]
module = [
    "pcbassist.schemas.*",
    "pcbassist.checks.*",
    "pcbassist.export.*",
    "pcbassist.kicad.*",
    "pcbassist.library.*",
    "pcbassist.llm.*",
]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["pcbassist"]
branch = true
