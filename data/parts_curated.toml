# Curated component library source.
#
# This file holds what a human curator vouches for: MPN, manufacturer, category, operating
# limits, currents and key specs. Pin tables, datasheet URLs and default footprints are NOT
# typed here; `scripts/build_seed.py` pulls them from the official KiCad symbol and
# footprint libraries and writes `data/components_seed.json`.
#
# Conventions
#   supply            = [min_v, max_v] recommended operating supply on the part's main
#                       power pin(s). Omitted for passives/connectors.
#   current_typ_ma    = typical active current; current_max_ma = worst-case peak the rail
#                       must deliver (e.g. WiFi TX burst); sleep_ua = lowest documented
#                       retention/sleep current.
#   data_confidence   = "high" (well-known datasheet figures) | "medium" (verify before use)
#   kicad_symbol      = "Lib:Symbol" in the KiCad symbol library, or "generic" to derive
#                       pins from the footprint pads (connectors, mechanical parts).
#   pin_tags          = extra function tags by pin *name* (strapping, usb_dp, ...)
#   pin_names         = rename generic pins by pin *number* (connectors only)

